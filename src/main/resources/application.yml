server:
  port: 8080

spring:
  application:
    name: farm-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发库，上线前请改为环境变量注入（不要硬编码密码）
    url: jdbc:mysql://localhost:3306/farm_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 739627
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

farm:
  jwt:
    # HS256 要求密钥至少 32 字节，上线前务必更换
    secret: farm-platform-jwt-secret-key-please-change-2024-0123456789
    expire-hours: 72

# MinIO 对象存储（需本地/服务器启动 MinIO 服务，默认 9000 端口）
minio:
  endpoint: http://localhost:9000
  access-key: root
  secret-key: 20031018
  bucket: farm
  # 对外可访问的地址（生产换成 CDN/域名）
  public-url: http://localhost:9000
